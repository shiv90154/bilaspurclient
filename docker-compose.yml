# Local development services.  Start with:  docker compose up -d
services:
  db:
    image: postgres:18-alpine
    container_name: edumanage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: edumanage
      POSTGRES_PASSWORD: edumanage
      POSTGRES_DB: edumanage
    ports:
      - "5433:5432"  # 5433 on the host: 5432 is often taken by other local Postgres containers
    volumes:
      - edumanage_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumanage -d edumanage"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Needed later for the video transcoding queue (BullMQ). Not used yet.
  # redis:
  #   image: redis:8-alpine
  #   ports:
  #     - "6380:6379"

volumes:
  edumanage_pgdata:

