<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1f4d2c" />
  <title>You are offline · DHĪ</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #fdfaf3; color: #1a2b20; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 20px 0 8px; font-size: 22px; color: #0d301c; }
    p { margin: 0; font-size: 15px; line-height: 1.55; color: #5a6659; }
    button { margin-top: 24px; height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #1f4d2c;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="DHĪ" />
    <h1>No internet connection</h1>
    <p>DHĪ needs the internet to load classes and your account. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
